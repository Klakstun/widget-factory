name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Gradle Android
      # You may pin to the exact commit or the version.
      # uses: Raul6469/android-gradle-action@b8fc7c7bde2562a4578b7e1bd996cc78d841638e
      uses: Raul6469/android-gradle-action@2.0.0
      with:
        # The ./gradlew command arguments (这里必须填值，我帮你填了 assembleDebug)
        script: assembleDebug
        # Your Android license agreement id (这里如果不是必填，我帮你注释掉，免得空值报错)
        # android-licence: 

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Widget-Factory-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
